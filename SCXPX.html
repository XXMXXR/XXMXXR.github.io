<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INSIDE 003</title>

    <style>
        body {
            background-color: #080808;
            color: #b8b8b8;
            font-family: monospace;
            margin: 0;
            padding: 40px 20px;
        }

        main {
            max-width: 700px;
            margin: 60px auto;
        }

        h1 {
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 5px;
            color: #eeeeee;
        }

        .date {
            color: #666666;
            font-size: 12px;
        }

        .track {
            margin-top: 70px;
            padding: 20px;
            border: 1px solid #292929;
        }

        .track-name {
            color: #eeeeee;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .track-info {
            color: #666666;
            font-size: 11px;
            margin-bottom: 20px;
        }

        audio {
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        footer {
            margin-top: 100px;
            color: #444444;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <main>

        <h1>INSIDE 003</h1>

        <p class="date">RECORD: 003 // STATUS: FOUND</p>

        <div class="track">

            <p class="track-name"> RECORDING 003 </p>

            <p class="track-info">AUDIO RECORDING // FILE 003</p>

            <audio controls>
                <source src="audio/RXCXRDXNG003.mp3" type="audio/mpeg">
                Your browser does not support audio playback.
            </audio>

        </div>

        <footer>
            END OF TRANSMISSION
        </footer>

    </main>

</body>

</html>
